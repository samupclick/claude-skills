<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850">
  <defs>
    <style>
      .title { font: bold 24px Arial, sans-serif; fill: #1a1a2e; }
      .subtitle { font: 13px Arial, sans-serif; fill: #666; }
      .box-label { font: bold 13px Arial, sans-serif; fill: white; }
      .box-detail { font: 11px Arial, sans-serif; fill: rgba(255,255,255,0.9); }
      .section-title { font: bold 14px Arial, sans-serif; fill: #1a1a2e; }
      .note { font: 11px Arial, sans-serif; fill: #555; }
      .note-bold { font: bold 11px Arial, sans-serif; fill: #333; }
      .code { font: bold 11px monospace; fill: #2196F3; }
      .decision { font: bold 12px Arial, sans-serif; fill: #333; }
      .arrow-label { font: 11px Arial, sans-serif; fill: #666; }
      .status-pass { font: bold 11px Arial; fill: #4CAF50; }
      .status-fail { font: bold 11px Arial; fill: #f44336; }
      .status-na { font: bold 11px Arial; fill: #9e9e9e; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4CAF50"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f44336"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF9800"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9C27B0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="850" fill="#fafafa"/>

  <!-- Header -->
  <rect width="1200" height="60" fill="#1a1a2e"/>
  <text x="600" y="32" text-anchor="middle" style="font: bold 22px Arial; fill: white;">Skill Orchestration Flow</text>
  <text x="600" y="50" text-anchor="middle" style="font: 12px Arial; fill: rgba(255,255,255,0.7);">Production skill → AEO Advisor validation → Human review gates</text>

  <!-- Version badge -->
  <rect x="1100" y="15" width="70" height="30" rx="5" fill="#9C27B0"/>
  <text x="1135" y="35" text-anchor="middle" style="font: bold 11px Arial; fill: white;">v1.1.0</text>

  <!-- ==================== MAIN FLOW ==================== -->

  <!-- START -->
  <circle cx="100" cy="180" r="30" fill="#4CAF50"/>
  <text x="100" y="185" text-anchor="middle" class="box-label">START</text>
  <text x="100" y="230" text-anchor="middle" class="note">Job enters</text>
  <text x="100" y="245" text-anchor="middle" class="note">production stage</text>

  <line x1="130" y1="180" x2="190" y2="180" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PRODUCTION SKILL -->
  <rect x="200" y="140" width="180" height="80" rx="10" fill="#2196F3"/>
  <text x="290" y="170" text-anchor="middle" class="box-label">PRODUCTION SKILL</text>
  <text x="290" y="190" text-anchor="middle" class="box-detail">Creates output</text>
  <text x="290" y="207" text-anchor="middle" class="box-detail">(Research / Draft / Schema)</text>

  <text x="290" y="245" text-anchor="middle" class="note-bold">Skills:</text>
  <text x="290" y="260" text-anchor="middle" class="note">hst-comparison-writer</text>
  <text x="290" y="275" text-anchor="middle" class="note">hst-listicle-writer</text>
  <text x="290" y="290" text-anchor="middle" class="note">aeo-entity-master</text>

  <line x1="380" y1="180" x2="450" y2="180" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="415" y="170" text-anchor="middle" class="arrow-label">Output</text>

  <!-- AEO ADVISOR -->
  <rect x="460" y="130" width="200" height="100" rx="10" fill="#FF9800"/>
  <text x="560" y="160" text-anchor="middle" class="box-label">AEO ADVISOR</text>
  <text x="560" y="180" text-anchor="middle" class="box-detail">Validates against checkpoints</text>
  <text x="560" y="197" text-anchor="middle" class="box-detail">hst-aeo-advisor skill</text>
  <text x="560" y="214" text-anchor="middle" class="box-detail">Returns PASS / FAIL / N/A</text>

  <!-- Checkpoint reference box -->
  <rect x="460" y="250" width="200" height="120" rx="8" fill="#fff3e0" stroke="#FF9800"/>
  <text x="560" y="272" text-anchor="middle" class="section-title">Checkpoints Evaluated</text>
  <text x="475" y="295" class="code">R01-R06</text>
  <text x="540" y="295" class="note">Research</text>
  <text x="475" y="315" class="code">D01-D08</text>
  <text x="540" y="315" class="note">Drafting</text>
  <text x="475" y="335" class="code">S01-S06</text>
  <text x="540" y="335" class="note">Schema</text>
  <text x="475" y="358" class="note-bold">Conditional: N/A if not applicable</text>

  <!-- DECISION DIAMOND -->
  <polygon points="780,180 850,130 920,180 850,230" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="850" y="175" text-anchor="middle" class="decision">All</text>
  <text x="850" y="192" text-anchor="middle" class="decision">PASS?</text>

  <line x1="660" y1="180" x2="780" y2="180" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PASS PATH (down) -->
  <line x1="850" y1="230" x2="850" y2="300" stroke="#4CAF50" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="870" y="270" class="status-pass">PASS</text>

  <!-- HUMAN REVIEW -->
  <rect x="770" y="310" width="160" height="80" rx="10" fill="#2196F3"/>
  <text x="850" y="340" text-anchor="middle" class="box-label">HUMAN REVIEW</text>
  <text x="850" y="360" text-anchor="middle" class="box-detail">Partner reviews output</text>
  <text x="850" y="377" text-anchor="middle" class="box-detail">Approves or requests changes</text>

  <!-- Human decision diamond -->
  <polygon points="850,440 910,400 970,440 910,480" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="910" y="438" text-anchor="middle" class="decision">Approve?</text>

  <line x1="850" y1="390" x2="850" y2="420" stroke="#666" stroke-width="2"/>
  <line x1="850" y1="420" x2="910" y2="420" stroke="#666" stroke-width="2"/>
  <line x1="910" y1="420" x2="910" y2="400" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Approved → Next Stage -->
  <line x1="970" y1="440" x2="1050" y2="440" stroke="#4CAF50" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="1010" y="430" class="status-pass">Yes</text>

  <rect x="1050" y="410" width="120" height="60" rx="10" fill="#9C27B0"/>
  <text x="1110" y="435" text-anchor="middle" class="box-label">NEXT STAGE</text>
  <text x="1110" y="455" text-anchor="middle" class="box-detail">or Complete</text>

  <!-- Not Approved → Back to skill -->
  <line x1="910" y1="480" x2="910" y2="520" stroke="#f44336" stroke-width="2"/>
  <line x1="910" y1="520" x2="290" y2="520" stroke="#f44336" stroke-width="2"/>
  <line x1="290" y1="520" x2="290" y2="220" stroke="#f44336" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="600" y="510" text-anchor="middle" class="status-fail">No → Revise</text>

  <!-- FAIL PATH (right from diamond) -->
  <line x1="920" y1="180" x2="1000" y2="180" stroke="#f44336" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="960" y="170" class="status-fail">FAIL</text>

  <!-- Retry counter -->
  <polygon points="1050,180 1100,140 1150,180 1100,220" fill="#fff" stroke="#f44336" stroke-width="2"/>
  <text x="1100" y="175" text-anchor="middle" class="decision">Retry</text>
  <text x="1100" y="192" text-anchor="middle" class="decision">&lt; 3?</text>

  <!-- Yes: Loop back to skill -->
  <line x1="1100" y1="140" x2="1100" y2="100" stroke="#FF9800" stroke-width="2"/>
  <line x1="1100" y1="100" x2="290" y2="100" stroke="#FF9800" stroke-width="2"/>
  <line x1="290" y1="100" x2="290" y2="140" stroke="#FF9800" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="1080" y="115" class="arrow-label">Yes</text>
  <text x="700" y="90" text-anchor="middle" class="note">Retry with checkpoint feedback</text>

  <!-- No: Escalate -->
  <line x1="1150" y1="180" x2="1170" y2="180" stroke="#9C27B0" stroke-width="3"/>
  <line x1="1170" y1="180" x2="1170" y2="310" stroke="#9C27B0" stroke-width="3"/>
  <line x1="1170" y1="310" x2="1050" y2="310" stroke="#9C27B0" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <text x="1175" y="250" class="note" style="fill:#9C27B0">No: Max retries</text>

  <rect x="950" y="285" width="100" height="50" rx="8" fill="#9C27B0"/>
  <text x="1000" y="308" text-anchor="middle" class="box-label">ESCALATE</text>
  <text x="1000" y="325" text-anchor="middle" class="box-detail">to Human</text>

  <!-- Arrow from Escalate to Human Review -->
  <line x1="950" y1="310" x2="930" y2="340" stroke="#9C27B0" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- ==================== BOTTOM SECTION: DETAILS ==================== -->

  <rect x="40" y="570" width="1120" height="260" rx="10" fill="white" stroke="#e0e0e0" stroke-width="2"/>

  <!-- Column 1: Checkpoint Output Format -->
  <g transform="translate(60, 590)">
    <text x="0" y="0" class="section-title">Checkpoint Output Format</text>

    <rect x="0" y="15" width="320" height="180" rx="6" fill="#f5f5f5" stroke="#ddd"/>
    <text x="10" y="35" style="font: 10px monospace; fill: #333;">STAGE: Drafting</text>
    <text x="10" y="52" style="font: 10px monospace; fill: #333;">ATTEMPT: 2 of 3</text>
    <text x="10" y="75" style="font: 10px monospace; fill: #333;">CHECKPOINTS:</text>
    <text x="20" y="92" style="font: 10px monospace; fill: #4CAF50;">D01_keyword_placement: PASS</text>
    <text x="20" y="109" style="font: 10px monospace; fill: #f44336;">D02_anchor_questions: FAIL</text>
    <text x="30" y="124" style="font: 9px monospace; fill: #666;">required: [Q1, Q2, Q3]</text>
    <text x="30" y="137" style="font: 9px monospace; fill: #666;">found: [Q1, Q3]</text>
    <text x="30" y="150" style="font: 9px monospace; fill: #666;">missing: [Q2]</text>
    <text x="30" y="163" style="font: 9px monospace; fill: #666;">action: "Add section for Q2"</text>
    <text x="20" y="178" style="font: 10px monospace; fill: #9e9e9e;">D07_internal_links: N/A (first article)</text>
  </g>

  <!-- Column 2: Override Protocol -->
  <g transform="translate(410, 590)">
    <text x="0" y="0" class="section-title">Override Protocol</text>

    <text x="0" y="25" class="note-bold">When to request override:</text>
    <text x="0" y="45" class="note">• Client explicitly requests deviation</text>
    <text x="0" y="62" class="note">• Technical limitation prevents compliance</text>
    <text x="0" y="79" class="note">• Time constraint with client acknowledgment</text>

    <text x="0" y="110" class="note-bold">Override process:</text>
    <text x="0" y="130" class="note">1. Advisor flags OVERRIDE_REQUESTED</text>
    <text x="0" y="147" class="note">2. Human reviews with context</text>
    <text x="0" y="164" class="note">3. APPROVE → Log + proceed</text>
    <text x="0" y="181" class="note">4. DENY → Continue retry loop</text>

    <rect x="0" y="200" width="200" height="30" rx="5" fill="#fff3e0" stroke="#FF9800"/>
    <text x="100" y="220" text-anchor="middle" class="note-bold" style="fill:#E65100">All overrides logged in job notes</text>
  </g>

  <!-- Column 3: Conditional Checkpoints -->
  <g transform="translate(710, 590)">
    <text x="0" y="0" class="section-title">Conditional Checkpoints</text>

    <text x="0" y="25" class="note-bold">Checkpoints that may be N/A:</text>

    <text x="0" y="50" class="code">S03 FAQ schema</text>
    <text x="0" y="67" class="note">→ Only if FAQ section exists</text>

    <text x="0" y="92" class="code">S04 HowTo schema</text>
    <text x="0" y="109" class="note">→ Only if step-by-step instructions exist</text>

    <text x="0" y="134" class="code">D07 Internal links</text>
    <text x="0" y="151" class="note">→ Only if Content Library has entries</text>

    <text x="0" y="185" class="note-bold">Evaluation flow:</text>
    <text x="0" y="205" class="note">1. Check condition trigger</text>
    <text x="0" y="222" class="note">2. Trigger present → Evaluate normally</text>
    <text x="0" y="239" class="note">3. Trigger absent → Mark N/A with reason</text>
  </g>

  <!-- Column 4: Adding New Checkpoints -->
  <g transform="translate(970, 590)">
    <text x="0" y="0" class="section-title">Adding Checkpoints</text>

    <text x="0" y="25" class="note-bold">Trigger:</text>
    <text x="0" y="42" class="note">Same feedback on 2+ jobs</text>

    <text x="0" y="72" class="note-bold">Process:</text>
    <text x="0" y="92" class="note">1. Propose (ID, criteria)</text>
    <text x="0" y="109" class="note">2. Weekly review</text>
    <text x="0" y="126" class="note">3. Test on 2 jobs</text>
    <text x="0" y="143" class="note">4. Implement in SOP</text>
    <text x="0" y="160" class="note">5. Log in CHANGELOG</text>

    <text x="0" y="190" class="note-bold">Naming:</text>
    <text x="0" y="207" class="note">R01-R99 (Research)</text>
    <text x="0" y="222" class="note">D01-D99 (Drafting)</text>
    <text x="0" y="237" class="note">S01-S99 (Schema)</text>
  </g>

  <!-- Footer -->
  <text x="600" y="840" text-anchor="middle" style="font: italic 11px Arial; fill: #777;">AEO Agency SOP v1.1.0 — Skill orchestration ensures consistent quality through automated validation + human oversight</text>
</svg>