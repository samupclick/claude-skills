<!doctype html>
<!-- product_photo_caption (references/families.md): the product in a real room, with one line of copy underneath.
     Rendered by scripts/render_creatives.py at 1080x1080. The image is the only generated part (text-free, FR-24);
     every word here is ours. Slots: {{image_data_uri}} {{caption}} {{cta_text}} {{client_name}}
     {{brand_font}} {{brand_primary}} {{brand_accent}} {{brand_bg}}. Values are HTML-escaped by the script. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; background: {{brand_bg}}; }
  body { font-family: "{{brand_font}}", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: {{brand_primary}}; }
  .photo { position: absolute; left: 0; right: 0; top: 0; height: 790px; background: url("{{image_data_uri}}") center / cover no-repeat; }
  .band { position: absolute; left: 0; right: 0; bottom: 0; height: 290px; background: {{brand_bg}};
          padding: 44px 72px 56px; display: flex; flex-direction: column; justify-content: space-between; }
  .caption { font-size: 44px; line-height: 1.22; font-weight: 600; letter-spacing: -0.01em; overflow-wrap: anywhere;
             display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .footer { display: flex; align-items: center; justify-content: space-between; }
  .brand { font-size: 28px; font-weight: 600; letter-spacing: .02em; }
  .cta { background: {{brand_accent}}; color: #fff; font-size: 30px; font-weight: 700; padding: 18px 36px; border-radius: 999px;
         white-space: nowrap; }
</style>
</head>
<body>
  <div class="photo"></div>
  <div class="band">
    <div class="caption">{{caption}}</div>
    <div class="footer"><div class="brand">{{client_name}}</div><div class="cta">{{cta_text}}</div></div>
  </div>
</body>
</html>
